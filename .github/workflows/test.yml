name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      donotpublish:
        description: '构建后不发布新版'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        run: |
          cat > /tmp/ks.b64 <<'KS_EOF'

KS_EOF
          base64 -d /tmp/ks.b64 > TVBoxOSC.jks
          chmod 600 TVBoxOSC.jks
          ls -la TVBoxOSC.jks

      - name: Use global maven repos
        run: |
          cat > /tmp/fixrepo.py <<'PYEOF'
          p='build.gradle'
          s=open(p).read()
          s=s.replace('maven { url "https://maven.aliyun.com/repository/releases" }','')
          s=s.replace('maven { url "https://maven.aliyun.com/repository/public" }','')
          open(p,'w').write(s)
          PYEOF
          python3 /tmp/fixrepo.py
          grep -n aliyun build.gradle || echo "aliyun removed"

      - name: Fix keystore path for Linux
        run: |
          cat > /tmp/fixpath.py <<'PYEOF'
          p='app/build.gradle'
          s=open(p).read()
          s=s.replace('..\\TVBoxOSC.jks','../TVBoxOSC.jks')
          open(p,'w').write(s)
          PYEOF
          python3 /tmp/fixpath.py
          grep -n TVBoxOSC.jks app/build.gradle

      - name: Fix pyramid build.gradle
        if: hashFiles('pyramid/build.gradle') != ''
        run: sed -i '/buildPython.*python.exe/d' pyramid/build.gradle

      - name: Setup local.properties
        run: echo "" > local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare APK
        run: |
          mkdir -p output
          find . -name "*release*.apk" -exec mv {} output/ \;
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeBox-APK
          path: output/*

      - name: Release APK
        if: ${{ !inputs.donotpublish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FreeBox v${{ github.run_number }}
          generate_release_notes: true
          files: output/*.apk
