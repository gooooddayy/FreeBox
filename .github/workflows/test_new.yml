name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      donotpublish:
        description: "build without publishing new release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        env:
          KS_B64: ""
        run: |
          printf "%s" "$KS_B64" | base64 -d > TVBoxOSC.jks
          chmod 600 TVBoxOSC.jks
          ls -la TVBoxOSC.jks
          file TVBoxOSC.jks

      - name: Strip aliyun maven mirrors from all gradle files
        run: |
          set +e
          files=$(grep -rl "aliyun" --include="*.gradle" --include="*.gradle.kts" . 2>/dev/null || true)
          if [ -n "$files" ]; then
            echo "Stripping aliyun mirrors from:"
            echo "$files"
            for f in $files; do
              before=$(grep -c "aliyun" "$f" 2>/dev/null || echo 0)
              sed -i "/aliyun/d" "$f"
              echo "  $f: removed lines"
            done
          else
            echo "No gradle files contain aliyun mirrors"
          fi
          echo "--- post-patch verification (should be empty) ---"
          remaining=$(grep -rl "aliyun" --include="*.gradle" --include="*.gradle.kts" . 2>/dev/null || true)
          if [ -n "$remaining" ]; then
            echo "WARNING: aliyun still present in: $remaining"
            exit 1
          else
            echo "OK: no aliyun left"
          fi

      - name: Fix keystore path for Linux
        run: |
          echo "--- before ---"
          grep -n TVBoxOSC.jks app/build.gradle || true
          # Match the whole storeFile file(...) expression with any number of backslashes before TVBoxOSC.jks
          sed -i -E "s|storeFile file\([^)]*TVBoxOSC\.jks[^)]*\)|storeFile file('TVBoxOSC.jks')|g" app/build.gradle
          echo "--- after ---"
          grep -n TVBoxOSC.jks app/build.gradle

      - name: Setup local.properties
        run: |
          # local.properties optional when ANDROID_HOME is set
          : > local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --warning-mode all --stacktrace 2>&1 | tee build.log
          echo "--- last 80 lines of build.log ---"
          tail -n 80 build.log || true

      - name: Prepare APK
        if: always()
        run: |
          mkdir -p output
          find . -name "*release*.apk" -exec mv {} output/ \; 2>/dev/null || true
          ls -la output/ 2>&1 || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeBox-APK
          if-no-files-found: warn
          path: output/*

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          path: build.log

      - name: Release APK
        if: success() && !inputs.donotpublish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FreeBox v${{ github.run_number }}
          generate_release_notes: true
          files: output/*.apk
