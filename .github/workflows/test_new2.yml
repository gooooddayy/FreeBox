name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      donotpublish:
        description: "build without publishing new release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK (manual, JDK 11 compatible)
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          echo "==> Downloading commandline-tools (v10.0, works with JDK 11) ..."
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-9862592_latest.zip -o ct.zip
          unzip -q ct.zip
          mv cmdline-tools latest
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export SKIP_JDK_VERSION_CHECK=1
          echo "==> Accepting Android SDK licenses ..."
          yes | sdkmanager --licenses || true
          echo "==> Installing SDK packages (platform-tools, android-33, build-tools 33.0.2) ..."
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "==> sdkmanager version:"
          sdkmanager --version
      - name: Decode signing keystore
        env:
          KS_B64: ""
        run: |
          printf "%s" "$KS_B64" | base64 -d > TVBoxOSC.jks
          cp TVBoxOSC.jks app/TVBoxOSC.jks
          chmod 600 TVBoxOSC.jks app/TVBoxOSC.jks
          ls -la TVBoxOSC.jks app/TVBoxOSC.jks
          file TVBoxOSC.jks

      - name: Fix keystore path for Linux
        run: |
          echo "--- before ---"
          grep -n "storeFile" app/build.gradle || true
          sed -i -E "s|storeFile file\([^)]*TVBoxOSC\.jks[^)]*\)|storeFile file('TVBoxOSC.jks')|g" app/build.gradle
          echo "--- after ---"
          grep -n "storeFile" app/build.gradle

      - name: Remove ndk block (no native code, avoids NDK requirement)
        run: |
          sed -i "/^[[:space:]]*ndk {/,/^[[:space:]]*}/d" app/build.gradle
          echo "--- ndk block removed ---"
          grep -n "ndk" app/build.gradle || echo "no ndk references left"

      - name: Setup local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "=== gradle version ==="
          ./gradlew --version 2>&1 | tee build.log
          echo "" >> build.log
          echo "=== assembleRelease start: $(date -u +%FT%TZ) ===" >> build.log
          ./gradlew assembleRelease --no-daemon --no-build-cache --warning-mode all --stacktrace 2>&1 | tee -a build.log
          rc=$?
          echo "" >> build.log
          echo "=== gradle exited with code $rc at $(date -u +%FT%TZ) ===" >> build.log
          echo "=== last 120 lines of build.log ==="
          tail -n 120 build.log || true
          if [ $rc -ne 0 ]; then
            echo "!! gradle assembleRelease failed with code $rc, failing the step"
            exit $rc
          fi
          echo "=== app/build/outputs tree ==="
          find app/build/outputs -type f 2>&1 | head -40 || true

      - name: Prepare APK
        if: always()
        run: |
          mkdir -p output
          found=$(find . -path ./node_modules -prune -o -name '*release*.apk' -type f -print 2>/dev/null | head -20)
          echo "=== APK files found: ==="
          echo "$found"
          if [ -z "$found" ]; then
            echo "!! No *release*.apk anywhere in repo"
            find . -name '*.apk' -type f 2>/dev/null | head -20 || true
          else
            while IFS= read -r f; do
              [ -n "$f" ] && mv "$f" output/ && echo "moved $f -> output/"
            done <<< "$found"
          fi
          echo "=== output/ contents ==="
          ls -la output/ 2>&1 || true
          apk_count=$(ls output/*.apk 2>/dev/null | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "!! no APK file to upload; failing"
            exit 1
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeBox-APK
          if-no-files-found: error
          path: output/*.apk

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          path: build.log

      - name: Release APK
        if: success() && !inputs.donotpublish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FreeBox v${{ github.run_number }}
          generate_release_notes: true
          files: output/*.apk
