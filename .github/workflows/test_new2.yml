name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      donotpublish:
        description: "build without publishing new release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore
        env:
          KS_B64: ""
        run: |
          printf "%s" "$KS_B64" | base64 -d > TVBoxOSC.jks
          chmod 600 TVBoxOSC.jks
          ls -la TVBoxOSC.jks
          file TVBoxOSC.jks

      - name: Strip aliyun and 4thline mirrors from all gradle files
        run: |
          set +e
          files=$(grep -rl -E "(aliyun\.com|4thline\.org)" --include="*.gradle" --include="*.gradle.kts" . 2>/dev/null || true)
          if [ -n "$files" ]; then
            echo "Stripping unreachable mirrors from:"
            echo "$files"
            for f in $files; do
              sed -i -E "/maven[[:space:]]*\{[[:space:]]*url[[:space:]]+"(https?:\/\/(maven\.aliyun\.com|.*\.4thline\.org)[^"]*)"[[:space:]]*\}/d" "$f"
              echo "  patched: $f"
            done
          else
            echo "No aliyun/4thline mirrors found"
          fi
          remaining=$(grep -rE "(aliyun\.com|4thline\.org)" --include="*.gradle" --include="*.gradle.kts" . 2>/dev/null || true)
          if [ -n "$remaining" ]; then
            echo "WARNING: still present:"
            echo "$remaining"
          else
            echo "OK: no aliyun/4thline left"
          fi

      - name: Inject Google + MavenCentral into empty repositories blocks
        run: |
          python3 - <<'INJECT_EOF'
          import os, re, glob
          patched = 0
          for gf in glob.glob("**/*.gradle", recursive=True) + glob.glob("**/*.gradle.kts", recursive=True):
            try: s = open(gf, encoding="utf-8").read()
            except: continue
            if "repositories" not in s: continue
            new = re.sub(
              r"repositories\s*\{\s*\}",
              "repositories {\n        google()\n        mavenCentral()\n        }",
              s)
            if new != s:
              open(gf, "w", encoding="utf-8").write(new)
              patched += 1
              print(f"  injected: {gf}")
          print(f"Total injected: {patched}")
          INJECT_EOF

      - name: Fix keystore path for Linux
        run: |
          echo "--- before ---"
          grep -n "storeFile" app/build.gradle || true
          sed -i -E "s|storeFile file\([^)]*TVBoxOSC\.jks[^)]*\)|storeFile file('TVBoxOSC.jks')|g" app/build.gradle
          echo "--- after ---"
          grep -n "storeFile" app/build.gradle

      - name: Disable pyramid buildPython (windows-only)
        if: hashFiles('pyramid/build.gradle') != ''
        run: |
          if grep -q "python\.exe" pyramid/build.gradle; then
            sed -i "/python\.exe/d" pyramid/build.gradle
            echo "Stripped python.exe line from pyramid/build.gradle"
          fi

      - name: Setup local.properties
        run: |
          : > local.properties

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "=== gradle version ===" | tee build.log
          ./gradlew --version 2>&1 | tee -a build.log
          echo "" >> build.log
          echo "=== assembleRelease start: $(date -u +%FT%TZ) ===" >> build.log
          # cache service was 500 earlier; use --no-build-cache. --no-daemon avoids daemon-related issues on cold runner.
          ./gradlew assembleRelease --no-daemon --no-build-cache --warning-mode all --stacktrace --info 2>&1 | tee -a build.log
          rc=$?
          echo "" >> build.log
          echo "=== gradle exited with code $rc at $(date -u +%FT%TZ) ===" >> build.log
          echo "=== last 150 lines of build.log ==="
          tail -n 150 build.log || true
          if [ $rc -ne 0 ]; then
            echo "!! gradle assembleRelease FAILED with code $rc, failing the step"
            exit $rc
          fi
          echo "=== app/build/outputs tree ==="
          find app/build/outputs -type f 2>&1 | head -40 || true

      - name: Prepare APK
        if: always()
        run: |
          mkdir -p output
          found=$(find . -path ./node_modules -prune -o -name "*release*.apk" -type f -print 2>/dev/null | head -20)
          echo "=== APK files found: ==="
          echo "$found"
          if [ -z "$found" ]; then
            echo "!! No *release*.apk found anywhere"
            echo "--- searching for any .apk files ---"
            find . -name "*.apk" -type f 2>/dev/null | head -20 || true
          else
            while IFS= read -r f; do
              if [ -n "$f" ]; then mv "$f" output/ && echo "moved $f -> output/"; fi
            done <<< "$found"
          fi
          echo "=== output/ contents ==="
          ls -la output/ 2>&1 || true
          apk_count=$(ls output/*.apk 2>/dev/null | wc -l)
          if [ "$apk_count" -eq 0 ]; then
            echo "!! no APK file to upload; failing"
            exit 1
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeBox-APK
          if-no-files-found: error
          path: output/*.apk

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          path: build.log

      - name: Release APK
        if: success() && !inputs.donotpublish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FreeBox v${{ github.run_number }}
          generate_release_notes: true
          files: output/*.apk
